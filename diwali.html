<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:linear-gradient(to bottom,#050816,#12002b,#220044);
    font-family:'Segoe UI',sans-serif;
    height:100vh;
}

canvas{
    position:fixed;
    top:0;
    left:0;
}

.content{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:10;
    text-align:center;
}

h1{
    color:#ffd700;
    font-size:4rem;
    text-shadow:
        0 0 10px #ffd700,
        0 0 20px #ff9900,
        0 0 40px #ff6600;
    animation:glow 2s infinite alternate;
}

h2{
    color:white;
    margin-top:15px;
    letter-spacing:3px;
}

p{
    color:#fff;
    max-width:700px;
    margin-top:20px;
    font-size:1.2rem;
    padding:0 20px;
}

.diya{
    font-size:70px;
    animation:float 2s ease-in-out infinite;
}

.diya.left{
    position:absolute;
    bottom:30px;
    left:10%;
}

.diya.right{
    position:absolute;
    bottom:30px;
    right:10%;
}

@keyframes glow{
    from{
        text-shadow:
        0 0 10px #ffd700,
        0 0 20px #ff9900;
    }
    to{
        text-shadow:
        0 0 20px #ffd700,
        0 0 40px #ff9900,
        0 0 80px #ff6600;
    }
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

.sparkles span{
    position:absolute;
    color:#fff;
    animation:spark 4s linear infinite;
}

@keyframes spark{
    from{
        transform:translateY(100vh) scale(0);
        opacity:0;
    }
    50%{
        opacity:1;
    }
    to{
        transform:translateY(-100px) scale(1);
        opacity:0;
    }
}
</style>
</head>
<body>

<canvas id="fireworks"></canvas>

<div class="content">
    <div class="diya">🪔</div>

    <h1>Happy Diwali</h1>

    <h2>✨ Festival of Lights ✨</h2>

    <p>
        May the glow of Diyas illuminate your life with happiness,
        prosperity, success and endless joy.
        Wishing you and your family a very Happy Diwali!
    </p>
</div>

<div class="diya left">🪔</div>
<div class="diya right">🪔</div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

const particles = [];

class Particle {
    constructor(x, y, color){
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = 2 + Math.random()*3;
        this.speedX = (Math.random()-0.5)*8;
        this.speedY = (Math.random()-0.5)*8;
        this.alpha = 1;
    }

    update(){
        this.x += this.speedX;
        this.y += this.speedY;
        this.alpha -= 0.01;
    }

    draw(){
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
        ctx.fillStyle=this.color;
        ctx.fill();
        ctx.restore();
    }
}

function createFirework(){
    const x = Math.random()*canvas.width;
    const y = Math.random()*canvas.height*0.6;

    const colors = [
        "#ff0000",
        "#ffd700",
        "#00ffcc",
        "#ff66ff",
        "#ffffff",
        "#ff8800"
    ];

    for(let i=0;i<80;i++){
        particles.push(
            new Particle(
                x,
                y,
                colors[Math.floor(Math.random()*colors.length)]
            )
        );
    }
}

function animate(){
    ctx.fillStyle="rgba(0,0,0,0.15)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    for(let i=particles.length-1;i>=0;i--){
        particles[i].update();
        particles[i].draw();

        if(particles[i].alpha<=0){
            particles.splice(i,1);
        }
    }

    requestAnimationFrame(animate);
}

animate();

setInterval(createFirework,700);
setTimeout(createFirework,500);
</script>

</body>
</html>
